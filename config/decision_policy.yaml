# L2 决策策略（可配置、可测、非 LLM 排序）
# 决策输出是「选项 + 风险 + 验证实验」，不是答案；用户基于自己的底线拍板（D7）。

# 决策类型 → 选项生成与排序策略
decision_types:
  # 怎么扭亏：从亏损出发，找互斥可执行的杠杆选项
  turnaround:
    option_cap: 4
    # 每个可能选项：改哪个字段 + 标签。
    # label_key 是 i18n 键（→ src/i18n/{zh,en}.yaml 的 policy.lever.*），
    # **此处不得写展示文案**：引擎把 cand 的标签原样塞进 op["label"] 渲染给用户，
    # 写中文 = 英文部署每次「怎么扭亏」都漏中文（真实事故，2026-10-05）。
    lever_candidates:
      - field: price_per_unit
        label_key: "policy.lever.price_up_elasticity"
      - field: daily_traffic
        label_key: "policy.lever.traffic_acquisition"
      - field: avg_salary
        label_key: "policy.lever.labor_cost_optimize"
      - field: employee_count
        label_key: "policy.lever.team_slim"
      - field: variable_cost_ratio
        label_key: "policy.lever.vcr_down"
      - field: monthly_rent
        label_key: "policy.lever.rent_renegotiate"
      - field: other_fixed
        label_key: "policy.lever.other_fixed_cut"
  # 先验证什么：找「不确定性最大 × 影响最大」的假设
  validate_first:
    option_cap: 3
    candidate_assumptions:
      - field: daily_traffic
        label_key: "policy.assumption.traffic"
      - field: price_per_unit
        label_key: "policy.assumption.price"
      - field: variable_cost_ratio
        label_key: "policy.assumption.vcr"
      - field: avg_salary
        label_key: "policy.assumption.labor"
  # 开不开 / 继续还是关：基于盈亏平衡与跑道
  go_no_go:
    option_cap: 3
    lever_candidates: []
  continue_stop:
    option_cap: 3
    lever_candidates: []
  # 现金能撑多久
  runway:
    option_cap: 3
    lever_candidates:
      - field: monthly_rent
        label_key: "policy.lever.rent_down_runway"
      - field: employee_count
        label_key: "policy.lever.labor_slim_runway"
      - field: price_per_unit
        label_key: "policy.lever.price_up_cashflow"
  # 多方案选择
  choose:
    option_cap: 4
    lever_candidates: []

# 选项排序权重：得分 = 杠杆强度分 × 影响系数 × 可逆性系数 / (1+验证成本)
ranking:
  # 字段 → 推动盈亏平衡的杠杆强度（0~1），代码据此给每个 op 打分
  lever_weights:
    price_per_unit: 0.9
    daily_traffic: 0.8
    employee_count: 0.7
    avg_salary: 0.7
    variable_cost_ratio: 0.6
    monthly_rent: 0.5
    other_fixed: 0.4
  # 可逆性：改完难回退的系数低
  reversibility:
    price_per_unit: 1.0      # 可随时改回
    daily_traffic: 1.0
    avg_salary: 0.8
    employee_count: 0.6      # 招人/裁员难回退
    variable_cost_ratio: 0.9
    monthly_rent: 0.4        # 租约难改
    other_fixed: 0.9
  # 验证成本（0~1，越低越优先试）：改这个参数验证假设的成本
  validation_cost:
    price_per_unit: 0.2      # 限时提价试最便宜
    daily_traffic: 0.5
    employee_count: 0.8
    avg_salary: 0.7
    variable_cost_ratio: 0.3
    monthly_rent: 1.0
    other_fixed: 0.6

# 否决条件（G6）：缺关键事实 → 「还不能定」+ 该补什么
veto:
  # 决策需要的关键字段；其 basis 为 missing 且无已采纳假设时否决确定性结论
  required_user_fields:
    turnaround: ["variable_cost_ratio"]
    go_no_go: ["variable_cost_ratio"]
    continue_stop: ["variable_cost_ratio"]
    runway: ["variable_cost_ratio"]
    validate_first: []
    choose: ["variable_cost_ratio"]
  # 跑道决策额外需要可用现金
  required_cash_fields:
    - total_investment

# 决策输出规范（D5/D6）：LLM 禁止倾向词，规则层只产出客观结构
output:
  # 按 locale 分桶。历史上这里是一张**纯中文**平表：en 部署下 LLM 输出英文，
  # 中文词永远命中不了 → forbidden_tone_scan 恒返回空 → D5 硬守卫在英文版
  # 等于不存在（静默失效，2026-10-05 发现）。中文只允许出现在 zh 桶里。
  forbidden_tone_words:
    zh:
      - "建议你"
      - "你应该"
      - "必须"
      - "千万不要"
      - "最好"
      - "推荐你"
    en:
      - "you should"
      - "you must"
      - "I recommend"
      - "we recommend"
      - "you'd better"
      - "make sure you"
