# ─── 本文件是「数据」不是「文案」 ──────────────────────────────────────────────
# 只放**与语言无关的事实**：数值区间、比率、季节系数。
# 任何会被用户看到的**词**（客流单位、风险提示、"不适用" 之类）一律进
# src/i18n/{zh,en}.yaml 的 bench.* 命名空间，由 i18n.benchmark_view() 在
# 出口处拼装 —— 数据文件里出现一个汉字，英文部署就会漏中文。
#
# 这条边界由 tests/test_i18n_guard.py::test_industry_config_is_locale_free 守着。
# 历史教训：这四项展示串曾经同时存在于本文件和 zh.yaml，靠「抄一份 + 相等断言」
# 硬撑；结果是改配置不改 yaml 就静默过期（中文显示旧基准、英文翻旧文案）。
# 现在只有 i18n 一处，重复本身被消除而不是被钉住。
#
# ─── 币种口径 ────────────────────────────────────────────────────────────────
# 本文件所有**金额**字段（avg_salary）为 **USD / 月·人（税前工资）**，2026-10 设定。
#
# ⚠️ 这些数字不是人民币按汇率折算出来的，是按美国市场重设的。汇率折算会系统性
#    低估人力成本：餐饮 ¥7,000/月 ÷ 7.2 ≈ $972，而美国餐饮从业者实际约 $3,200/月
#    （BLS OEWS May 2025：餐厅厨师 $37-38k/年、快餐柜台 $32,150/年）。
#
# 主要依据：U.S. BLS Occupational Employment and Wage Statistics, May 2025
#   - 快餐/柜台 $32,150/年；餐厅厨师 ~$37-38k/年；零售销售 $37,310/年
#   - 注册护士 $101,420/年；软件工程师中位数 $135,980/年
#   - 全行业平均 $69,770/年、中位数 $50,980/年
#
# 仍未本地化的中国口径（已知，待办）：
#   - labor_burden（雇主负担）：仍是中国社保公积金口径 0.3~0.4；
#     美国法定负担约 0.10~0.15（FICA 7.65% + 失业/工伤险），含商业医保约 0.22~0.30。
#   - seasonal_profile：已改为**美国日历**（圣诞季/返校季/Prime Day），2026-10。
industry_templates:
  餐饮:
    # 季节系数：12个月（1月…12月），1.0 为基准。
    # 美国日历：1-2 月新年后清淡、5-7 月露台/独立日旺季、11-12 月感恩节与
    # 年末聚餐/团餐最强。原中国版是「春节旺、年末聚餐旺」，1 月 1.2 在美国是反的。
    seasonal_profile: [0.90, 0.92, 0.98, 1.00, 1.05, 1.08, 1.10, 1.02, 0.95, 1.00, 1.10, 1.18]
    hypotheses:
      variable_cost_ratio: 0.4
      employee_count: 3
      avg_salary: 3200
      equipment_ratio: 0.6
      labor_burden: 0.4
      cost_structure:
        rent: 0.3
        packaging: 0.08
        marketing: 0.12
        labor: 0.4
        other: 0.1
    benchmark:
      profit_margin_min: 0.15
      profit_margin_max: 0.25
      breakeven_months_min: 6
      breakeven_months_max: 12
      traffic_min: 80
      traffic_max: 250
  零售:
    # 季节系数：12个月（1月…12月），1.0 为基准。
    # 美国日历：1-2 月节后最淡、8 月返校季次高峰、11 月黑五与 12 月圣诞季全年最强。
    # 原中国版 11 月 1.3 是靠双11，12 月只有 1.1 —— 美国正好相反，12 月才是峰值。
    seasonal_profile: [0.85, 0.88, 0.95, 0.95, 1.00, 0.95, 0.95, 1.05, 0.98, 1.05, 1.30, 1.35]
    hypotheses:
      variable_cost_ratio: 0.55
      employee_count: 2
      avg_salary: 3000
      equipment_ratio: 0.5
      labor_burden: 0.35
      cost_structure:
        rent: 0.25
        packaging: 0.05
        marketing: 0.2
        labor: 0.35
        other: 0.15
    benchmark:
      profit_margin_min: 0.1
