# ─── 币种口径 ────────────────────────────────────────────────────────────────
# 本文件所有**金额**字段（avg_salary）为 **USD / 月·人（税前工资）**，2026-10 设定。
#
# ⚠️ 这些数字不是人民币按汇率折算出来的，是按美国市场重设的。汇率折算会系统性
#    低估人力成本：餐饮 ¥7,000/月 ÷ 7.2 ≈ $972，而美国餐饮从业者实际约 $3,200/月
#    （BLS OEWS May 2025：餐厅厨师 $37-38k/年、快餐柜台 $32,150/年）。
#
# 主要依据：U.S. BLS Occupational Employment and Wage Statistics, May 2025
#   - 快餐/柜台 $32,150/年；餐厅厨师 ~$37-38k/年；零售销售 $37,310/年
#   - 注册护士 $101,420/年；软件工程师中位数 $135,980/年
#   - 全行业平均 $69,770/年、中位数 $50,980/年
#
# 仍未本地化的中国口径（已知，待办）：
#   - labor_burden（雇主负担）：仍是中国社保公积金口径 0.3~0.4；
#     美国法定负担约 0.10~0.15（FICA 7.65% + 失业/工伤险），含商业医保约 0.22~0.30。
#   - seasonal_profile：按中国节假日（春节/双11）设定，美国应为圣诞/暑期/返校季。
industry_templates:
  餐饮:
    # 季节系数：12个月，1.0为基准。餐饮春节旺、夏季饮品旺、年末聚餐旺
    # 来源：中国餐饮协会行业报告 + 外卖平台月度数据经验
    seasonal_profile: [1.2, 1.0, 0.9, 0.95, 1.0, 1.1, 1.15, 1.1, 1.0, 1.05, 1.1, 1.15]
    hypotheses:
      variable_cost_ratio: 0.4
      employee_count: 3
      avg_salary: 3200
      equipment_ratio: 0.6
      labor_burden: 0.4
      cost_structure:
        rent: 0.3
        packaging: 0.08
        marketing: 0.12
        labor: 0.4
        other: 0.1
    benchmark:
      daily_traffic_range: 80-250 杯
      typical_profit_margin: 15-25%
      avg_breakeven_months: 6-12 个月
      key_warning: 新店前 3 个月客流通常只有目标值的 40-50%
      profit_margin_min: 0.15
      profit_margin_max: 0.25
      breakeven_months_min: 6
      breakeven_months_max: 12
      traffic_min: 80
      traffic_max: 250
  零售:
    # 季节系数：零售双11/双12旺、春节前旺、夏季淡
    seasonal_profile: [0.85, 0.8, 0.9, 0.95, 1.0, 1.05, 0.95, 0.9, 1.0, 1.1, 1.3, 1.1]
    hypotheses:
      variable_cost_ratio: 0.55
      employee_count: 2
      avg_salary: 3000
      equipment_ratio: 0.5
      labor_burden: 0.35
      cost_structure:
        rent: 0.25
        packaging: 0.05
        marketing: 0.2
        labor: 0.35
        other: 0.15
    benchmark:
      daily_traffic_range: 50-150 人
      typical_profit_margin: 10-18%
      avg_breakeven_months: 8-18 个月
      key_warning: 库存周转率是核心指标，建议控制在 30 天以内
      profit_margin_min: 0.1
      profit_margin_max: 0.18
      breakeven_months_min: 8
      breakeven_months_max: 18
      traffic_min: 50
      traffic_max: 150
  SaaS:
    hypotheses:
