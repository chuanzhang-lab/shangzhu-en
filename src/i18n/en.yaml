# English copy resources — single source of truth for output-layer text
# (loaded by src/i18n/__init__.py)
# Convention: nested structure is flattened to dotted keys (fmt.scan.title).
# Key set MUST stay in sync with zh.yaml — enforced by tests/test_i18n_guard.py.

fmt:
  # ── Shared fragments ──────────────────────────────────────────────────
  common:
    project_type_default: "Project"
    qual_suffix: " ({s})"
    money: "${v}"
    delta_money: "+${v}"
    unknown: "Unknown"
    unknown_pending: "Unknown / to be filled"
    infinite: "Unlimited"
    assumptions_header: "## Current assumptions (fill in to take effect)"
    assumptions_table_header: "| Parameter | Current value | Source |"
    supplement: "- Add: {item}"

  # ── Traffic unit ──────────────────────────────────────────────────────
  traffic_unit:
    fallback: "units/day"
    per_day: "/day"

  # ── Insufficient-parameters skeleton ──────────────────────────────────
  insufficient:
    title: "## ⚠️ Insufficient parameters — full analysis paused"
    default_message: "Parameters are insufficient; no dashboard is produced yet."
    gaps_header: "## Parameters still missing"
    coverage: "Parameter coverage: **{pct}%**"
    framework_header: "## Current model framework (known inputs only)"
    revenue: "- Revenue: {v}"
    cost: "- Cost: {v}"
    cash: "- Cash: {v}"
    next_step_default: "Fill in the parameters above and run the analysis again."

  # ── Exact derivation layer ────────────────────────────────────────────
  derived:
    title: "## 📐 Exact derivation (derived from your inputs by formula, not guessed)"
    table_header: "| Parameter | Derived value | Formula |"
    cannot_derive: "**Cannot derive yet** (missing inputs):"
    missing_item: "- {label}: missing **{missing}**{fx}"

  # ── quick_scan ────────────────────────────────────────────────────────
  scan:
    error: "## ⚠️ Calculation failed\n\n{error}\n\nPlease check your inputs (rent, traffic, unit price, etc.)."
    title: "## 📊 {project_type} analysis{suffix}"
    conflict_header: "## ⚠️ Data conflicts (please confirm the definitions)"
    # Shown when fixed cost misses a core component (e.g. labor not provided → counted as 0).
    # {detail} is the engine-produced source string (naming the missing component);
    # it is not re-written here, so the two cannot drift apart.
    cost_incomplete_note: "> ⚠️ **Incomplete cost**: {detail}. Profit, break-even traffic and runway all skew optimistic — fill the gap before trusting the numbers."
    core_header: "## Core metrics"
    core_table_header: "| Metric | Value | Status |"
    vc_gap_note1: "> 📌 **Variable cost ratio not provided — profit and break-even are not settled yet.**"
    vc_gap_note2: "> Add one line such as \"variable cost ratio 55%\" or \"cost per unit $X\" to get a hard conclusion."
    profit_unknown: "⚪ Unknown (needs variable cost ratio)"
    profit_up: "🟢 Profitable"
    profit_down: "🔴 Loss-making"
    profit_row: "| Monthly profit | {value} | {status} |"
    revenue_row: "| Monthly revenue | {value} | — |"
    breakeven_row: "| Break-even traffic | {value} {unit} | — |"
    margin_row: "| Gross margin | {value}% | — |"
    runway_unknown_vc: "| Runway | Unknown (needs variable cost ratio) | {status} |"
    runway_months: "| Runway | {value} months | {status} |"
    runway_unknown_invest: "| Runway | Unknown (needs total investment) | {status} |"
    narrative_header: "## 🎯 Risk focus"
    params_header: "## Parameters (source)"
    params_table_header: "| Parameter | Value | Source |"
    scenarios_header: "## 📊 Scenario analysis (optimistic / base / conservative)"
    scenarios_note: "> This is not one dead number but a range — it depends on which assumptions hold."
    scenarios_table_header: "| Metric | Conservative | Base | Optimistic |"
    scenarios_profit_row: "| Monthly profit | {worst} | {base} | {best} |"
    scenarios_runway_row: "| Runway (months) | {worst} | {base} | {best} |"
    scenarios_drivers: "The range is driven by these **unconfirmed assumptions**: {items}"
    sensitivity_header: "## Sensitivity analysis"
    sensitivity_table_header: "| Scenario | Revenue | Cost | Monthly profit |"
    risk_header: "## Risks"
    risk_table_header: "| Level | Risk |"
    benchmark_header: "## Industry reference"
    ops_hint: "Actions: change parameters | trend forecast | compare scenarios | parameter suggestions | export PDF"

  # ── trend_projection ──────────────────────────────────────────────────
  trend:
    error: "## ⚠️ Trend forecast failed\n\n{error}"
    title: "## 📈 12-month trend forecast"
    seasonal_source: "> Seasonality source: {source}"
    summary_header: "## Summary"
    summary_table_header: "| Metric | Value |"
    monthly_header: "## Monthly detail"
    monthly_table_header: "| Month | Revenue | Fixed cost | Variable cost | Profit | Cumulative |"
    ops_hint: "Actions: change parameters | recalculate | compare scenarios | parameter suggestions"

  # ── compare_scenarios ─────────────────────────────────────────────────
  compare:
    error: "## ⚠️ Comparison failed\n\n{error}"
    title: "## 🔀 Scenario comparison"
    table_header: "| Metric | Scenario A | Scenario B | Difference |"
    profit_row: "| Monthly profit | {base} | {alt} | {diff} |"
    revenue_row: "| Monthly revenue | {base} | {alt} | {diff} |"
    fixed_row: "| Monthly fixed cost | {base} | {alt} | {diff} |"
    verdict: "## Verdict: {verdict}"
    profit_diff: "\nProfit difference: ${value}/month"
    revenue_diff: "Revenue difference: ${value}/month"
    ops_hint: "Actions: change parameters | trend forecast | parameter suggestions | export PDF"

  # ── suggest_params ────────────────────────────────────────────────────
  suggest:
    error: "## ⚠️ Parameter suggestions failed\n\n{error}"
    title: "## 💡 Parameter tuning suggestions"
    expectation_header: "## Expected after adjustment"
    current_profit: "- Current monthly profit: **${value}**"
    projected_profit: "- Monthly profit after adjustment: **${value}**"
    total_improvement: "- Total improvement: **${value}/month**"
    verdict: "- Verdict: {verdict}"
    issues_header: "## Issues detected"
    issues_table_header: "| Severity | Issue |"
    suggestions_header: "## Suggested adjustments"
    suggestions_table_header: "| Parameter | Current | Suggested | Direction | Rationale | Est. profit gain |"
    ops_hint: "Actions: try changing parameters | compare scenarios | trend forecast | export PDF"
    ops_tip: "> 💡 Start with the direction that has the biggest impact for the smallest change."

  # ── report ────────────────────────────────────────────────────────────
  report:
    error: "## ⚠️ Report generation failed\n\n{error}"
    title: "## 📄 Report generation"
    generated_with_path: "Report generated: `{path}`"
    generated: "Report generated."

  # ── benchmark ─────────────────────────────────────────────────────────
  benchmark:
    error: "## ⚠️ Data lookup failed\n\n{error}"
    title: "## 📚 Industry benchmark data"

  # ── Cost attribution ──────────────────────────────────────────────────
  attribution:
    error: "## ⚠️ Attribution analysis failed\n\n{error}"
    cannot_title: "## 💰 Cost attribution not settled yet"
    cannot_message: "Cost data is insufficient for attribution analysis."
    title: "## 💰 Cost structure attribution"
    total_cost: "**Total monthly cost**: ${total} (fixed {fixed} + variable {variable})"
    ratio: "**Fixed / variable ratio**: {fixed:.0%} / {variable:.0%}"
    components_header: "### Component breakdown"
    components_table_header: "| Item | Amount | Share | Source |"
    component_row: "| {name} | ${amount} | {pct} | {source} |"
    chart_header: "### Cost share chart"
    top_component: "**Largest cost item**: {name} (${amount}, {pct} of total)"
    warnings_header: "### Risk notes"
    ops_hint: "Actions: change parameters | sensitivity analysis | compare scenarios | trend forecast"

  # ── Sensitivity / elasticity ──────────────────────────────────────────
  sensitivity:
    error: "## ⚠️ Sensitivity analysis failed\n\n{error}"
    cannot_title: "## 📐 Sensitivity analysis not settled yet"
    cannot_message: "Data is insufficient for elasticity analysis."
    title: "## 📐 Elasticity analysis"
    variable: "**Variable analysed**: {label}"
    current: "**Current value**: {value}"
    no_breakeven: "The break-even point cannot be calculated."
    breakeven: "**Break-even point**: {value}"
    margin: "**Safety margin**: {value} ({pct}) · direction: {direction}"
    curve_header: "### Profit as the variable changes"
    curve_table_header: "| {label} | Monthly profit | Status |"
    curve_row: "| {value} | ${profit} | {status} |"
    ops_hint: "Actions: change parameters | cost attribution | compare scenarios | trend forecast"

  # ── Cash flow ─────────────────────────────────────────────────────────
  cashflow:
    error: "## ⚠️ Cash flow calculation failed\n\n{error}\n\nPlease check that opening cash (total investment) and monthly revenue are provided."
    cannot_title: "## 💧 Cash flow not settled yet"
    cannot_message: "Opening cash or monthly revenue was not provided, so no deterministic cash flow detail can be given."
    title: "## 💧 Cash flow detail (12 months)"
    opening: "**{project_type}** · opening cash = {value} (derived from total investment)"
    table_header: "| Month | Cash in | Cash out | Net | Closing cash |"
    zero_cash: "📉 **Cash hits zero**: with no external funding, cash runs out around month **{month}**."
    no_zero_cash: "🟢 **Cash is not exhausted within 12 months** (based on current inputs; the conclusion moves if assumptions do)."
    max_shortfall: "💰 **Largest cumulative shortfall**: about **${value}** (the gap after the zero-cash month)."
    note: "> Cash flow tracks actual receipts and payments only (one-off large items, collection delays, quarterly payments) and is decoupled from profit (P&L)."

# ── Field model (src/field_model.py) ────────────────────────────────────
# Specs store label_key / unit_key only; text is resolved through t() at render
# time, so switching locale never rebuilds the model.
field:
  label:
    total_investment: "Total investment"
    monthly_rent: "Monthly rent"
    daily_traffic: "Daily traffic"
    price_per_unit: "Unit price"
    employee_count: "Headcount"
    avg_salary: "Average salary"
    labor_burden: "Labor burden rate"
    variable_cost_ratio: "Variable cost ratio"
    unit_variable_cost: "Unit variable cost"
    gross_margin: "Gross margin"
    utilities: "Utilities"
    packaging: "Packaging"
    commission: "Commission"
    other_fixed: "Other fixed"
    equipment_ratio: "Equipment share"
    monthly_revenue: "Monthly revenue"
    monthly_profit: "Monthly profit"
    monthly_expense: "Monthly fixed cost (explicit total)"
    stage: "Stage"
    industry: "Industry"
    founder_count: "Founders"
    monthly_growth_rate: "Monthly growth rate"
    seasonal_factor: "Seasonal factor"
    analysis_months: "Months analysed"
    monthly_labor: "Monthly labor"
    monthly_fixed_cost: "Monthly fixed cost"
    monthly_variable_cost: "Monthly variable cost"
    annual_fixed_cost: "Annual fixed cost"
    available_cash: "Available cash"

  unit:
    # 键名 yuan / yuan_per_month 是**历史内部标识**（跨 locale 键集合必须一致，
    # 改名会打破 test_locale_key_parity_between_zh_and_en）；值才是展示币种。
    # 本部署为 USD，故值是 $ —— 改币种只改这里，不要去动键名。
    yuan: "$"
    yuan_per_month: "$/month"
    yuan_per_year: "$/year"
    yuan_per_unit: "$/unit"
    person_per_day: "customers/day"
    person: "people"
    ratio: "0~1"
    month: "months"

  # Fixed-cost component names (a different register from field labels)
  comp:
    rent: "Rent"
    labor: "Labor"

  # Source semantics
  src:
    user_direct: "Provided directly by the user"
    derived: "Derived by formula"

  # Formula descriptions (with actual numbers)
  desc:
    monthly_revenue: "Daily traffic {traffic} × unit price {price} × {days} days"
    vcr_from_unit_cost: "Unit variable cost {uvc} ÷ unit price {price}"
    vcr_from_gross_margin: "1 − gross margin {gm}"
    # 英文：货币符号在数字**前面**（"average $3200"）；中文侧是「人均 3200 美元」，
    # 符号在后 —— 各语言各自调 token 顺序，不写死 $（避免与 field.unit.yuan 漂移）。
    monthly_labor: "Headcount {count} × average {yuan}{salary}"
    labor_burden_tail: " ×(1+{rate} burden)"
    monthly_variable_cost: "Monthly revenue {rev} × variable cost ratio {vcr}"
    monthly_profit: "Monthly revenue {rev} − monthly fixed cost {fixed} − monthly variable cost {variable}"
    variable_cost_per_unit: "Unit price {price} × variable cost ratio {vcr}"
    annual_fixed_cost: "Monthly fixed cost {fixed} × {months}"
    gross_margin: "1 − variable cost ratio {vcr}"
    available_cash_with_ratio: "Total investment {investment} ×(1−equipment share {ratio})"
    available_cash: "Total investment {investment}"
    fixed_cost_labor: "Labor ({count}×{salary})"
    fixed_cost_fallback: "Fixed cost components"

  # Consistency rules
  rule:
    revenue_vs_traffic: "Monthly revenue {rev} differs by more than 50% from {implied} implied by daily {traffic} × price {price} × {days} days — please confirm the definition"
    cost_unsustainable: "Total cost {total} is more than 10× monthly revenue {rev}; this parameter combination is not physically sustainable"
    vcr_vs_gross_margin: "Gross margin {gm}% contradicts variable cost ratio {vcr}% (the ratio implies a gross margin of {implied}%); currently calculated on the variable-cost-ratio basis — keep only one if gross margin should govern"
    vcr_vs_unit_cost: "Variable cost ratio {vcr}% contradicts {implied}% implied by unit cost {uvc} ÷ price {price}; currently calculated on your stated ratio — please confirm which basis is correct"

  # Conflict-resolution ops
  op:
    set_revenue: "Set monthly revenue to {value} (traffic × price × {days})"
    set_revenue_reason: "Traffic {traffic} × price {price} × {days} days = {implied}"
    set_traffic: "Set traffic to {value}/day (back-solved from monthly revenue)"
    set_traffic_reason: "Monthly revenue {rev} ÷ ({price}×{days}) = {implied}"
    set_gross_margin: "Set gross margin to {value}% (implied by variable cost ratio)"
    set_gross_margin_reason: "1 − variable cost ratio {vcr}% = {value}%"
    set_vcr: "Set variable cost ratio to {value}% (implied by gross margin)"
    set_vcr_reason: "1 − gross margin {gm}% = {value}%"

  msg:
    cycle_dependency: "The field model contains a dependency cycle: {cycle}"
    missing_deps: "dependent inputs"

src:
  mark:
    user: "[User]"
    derived: "[Derived]"
    candidate: "[Candidate]"
    missing: "[Missing]"
    conflict: "[Conflict]"
    incomplete: "[Incomplete]"
  comp:
    rent: Rent
    labor: Labor
    utilities: Utilities
    packaging: Packaging
    commission: Commission
    other: Other fixed
  # Joiner for missing component names (locale-dependent): "、" in zh, ", " in en
  comp_join: ", "
  user:
    bare: "[User]"
    explicit_total: "[User] Explicit total (components not given)"
    revenue_series: "[User] Multi-period series ({n} periods)"
  derived:
    daily_revenue: "[Derived] {src}"
    revenue_from_traffic: "[Derived] From traffic × unit price × {days} days"
    cash_from_invest: "[Derived] Total investment × (1 − equipment ratio [User])"
    cash_no_equip_ratio: "[Derived] Total investment (equipment ratio not given, not deducted)"
    from_profit: "[Derived] Back-derived from user monthly profit"
    profit: "[Derived] Revenue − fixed − variable"
    variable_cost: "[Derived] Monthly revenue × variable cost ratio"
    unit_var_cost: "[Derived] Unit price × variable cost ratio"
    annual_fixed: "[Derived] Monthly fixed cost × 12"
    gross_margin: "[Derived] 1 − variable cost ratio"
    vcr_from_unit_cost: "[Derived] Unit variable cost ÷ unit price"
    vcr_from_gm: "[Derived] Back-derived from user gross margin"
    vcr_formula: "[Derived] Formula-derived"
  missing:
    revenue_none: "[Missing] Monthly revenue not given (and no traffic or unit price)"
    labor_abnormal: "[Missing] Headcount abnormal; labor excluded from calculation"
    not_provided: "[Missing] Not provided"
    not_invented: "[Missing] Not provided (not invented)"
    investment_none: "[Missing] Total investment not given"
    variable_cost: "[Missing] Variable cost ratio or monthly revenue not given"
    unit_var_cost: "[Missing] Unit price or variable cost ratio not given"
    annual_fixed: "[Missing] Monthly fixed cost not given"
    profit_incomplete: "[Missing] Insufficient inputs to compute profit"
    profit_no_fixed: "[Missing] Fixed cost not given; cannot compute profit"
    vcr_unknown: "[Missing] Not provided (treated as unknown)"
    labor_burden_zero: "[Missing] Not provided (treated as 0; employer burden not included)"
  conflict:
    staff_out_of_range: "[Conflict] Headcount {n} exceeds reasonable range (≤200); likely salary×count mis-parse → to clarify"
  labor_cash: "{mark} {n} people × {salary}"
  labor_burdened: "{mark} Base pay {cash} × (1 + {burden} burden)"
  fixed_cost_sum: "{mark} Component sum ({comp})"
  fixed_cost_sum_conflict: "{mark} Component sum ({comp}) conflicts with explicit total {total} → to clarify"
  # Missing a core component (rent/labor) → the sum is necessarily too low.
  # Must NOT be labelled as a complete derivation.
  # Deliberately avoids "conflict/contradict/mismatch": those are the match words of
  # pitfall_markers.conflict, and using them would make AnomalyReport misreport
  # "incomplete" as "self-contradictory".
  fixed_cost_sum_incomplete: "{mark} Component sum ({comp}); {missing} not provided → cost understated"
wf:
  mode:
    custom: Custom (sufficient user parameters; industry template skipped)
    industry: "Industry template \"{industry}\""
  mixed:
    prefix: "Mixed-business characteristics detected; computed with the \"{industry}\" template. Specify an industry to switch."
  gap:
    revenue: Monthly revenue (or daily traffic + unit price)
    investment: Total investment (needed for runway/risk)
    labor: Labor cost (headcount + salary; treated as 0 if not given)
    variable_cost: Variable cost ratio (needed for profit/breakeven)
  kind:
    missing: Missing
    candidate: Candidate
    derived: Derived
    incomplete: Incomplete
  framework:
    revenue_known: "Monthly revenue = ${rev} (known)"
    revenue_unknown: "Monthly revenue: unknown (needs monthly revenue or daily traffic × unit price)"
    cost: "Monthly fixed cost ≈ rent ${rent}"
    labor_part: " + labor ${labor}"
    labor_none: " (labor not given, treated as 0)"
    cash_known: "Available cash = ${cash}"
    cash_unknown: "Available cash: unknown (needs total investment)"
  readiness:
    no_vcr: Variable cost ratio not given (or not derivable); cannot compute monthly profit and trend
    no_revenue: Monthly revenue not given; cannot compute monthly profit and trend
    no_fixed: Fixed cost not given; cannot compute monthly profit and trend
  bench:
    margin_low: "Net margin {nm}% is below the industry-typical {lo}%–{hi}%; review pricing or whether variable costs are omitted."
    margin_high: "Net margin {nm}% is above the industry-typical {lo}%–{hi}%; confirm variable/hidden costs are not underestimated."
    payback_exceed: "Estimated payback ~{months} months, exceeding the industry-typical range{hint}; cash flow pressure is high."
    breakeven_hint: " ({bmin}–{bmax} months)"
    traffic_low: "Daily traffic {dt} is below the industry-typical {tmin}–{tmax}; watch ramp-up and customer acquisition."
    traffic_high: "Daily traffic {dt} is above the industry-typical {tmin}–{tmax}; confirm sustainability."
  trend:
    dir_up: 📈 Up
    dir_down: 📉 Down
    dir_flat: ➡️ Flat
    irr_percent: "{pct}%"
    irr_unconverged: Not converged
    runway_months: "{n} months"
    runway_beyond: ">{n} months (not exhausted)"
    seasonal_industry: "Industry template ({industry})"
    seasonal_generic: Generic coefficients (for reference only)
  skeleton:
    message: Insufficient parameters — full analysis paused; only the model framework and missing fields are shown. Fill them in and re-run for a full dashboard.
    next_step: "Suggested to add: monthly revenue (or daily traffic + unit price), total investment, and labor cost (headcount + salary)."
  narrative:
    confident: All key parameters were provided by you; confidence is high. The figures below are safe to use as decision references.
    profit_unknown: "Monthly profit: not yet computable (needs variable cost ratio)"
    profit_range: "Under current assumptions, monthly profit ≈ ${base} (optimistic {best} / conservative {worst})"
    profit_approx: "Monthly profit ≈ ${v}"
    risk_focus: "Risk focus: the elasticity of the conclusion mainly comes from the \"{lead}\" assumption. {rng}. It is what you should verify/fill in first — once it changes, the figures above will move with it."
    extra_risks: " There are also {n} structured risks to watch (see \"Risks\" below)."
  scenario:
    driver_vc_guess: Variable cost ratio (industry candidate/derived)
    driver_vc_missing: Variable cost ratio (not given; profit not computable)
    driver_rev_guess: Monthly revenue (derived from traffic, which fluctuates)
    driver_labor_missing: Labor cost (not given, treated as 0)
    driver_cash_missing: Total investment (runway unknown)
  lever:
    employee_count: Labor cost (currently treated as 0; most likely underestimates real cost)
    monthly_revenue: Monthly revenue (derived from traffic × unit price; traffic still fluctuates)
    variable_cost_ratio: Variable cost ratio (industry default; may deviate from your actual)
    total_investment: Total investment (not given; runway unknown)
  status:
    profit_unknown: ⚪ Unknown (needs variable cost ratio)
    profit_up: 🟢 Profitable
    profit_down: 🔴 Loss-making
    cash_unknown_vc: ⚪ Unknown (needs variable cost ratio)
    cash_unknown_invest: ⚪ Unknown (needs total investment)
    cash_positive: 🟢 Positive cash flow
    cash_danger: 🔴 Danger
    cash_tight: 🟡 Tight
    cash_safe: 🟢 Safe
    cash_unknown: ⚪ Unknown
    be_traffic_short: 🔴 Traffic insufficient
    be_reachable: 🟢 Breakeven reachable
    be_below: 🔴 Below breakeven
    be_partial: ⚪ Partially unknown (unit price/traffic/revenue not given; breakeven incomplete)
    margin_healthy: 🟢 Healthy
    margin_fair: 🟡 Fair
    margin_low: 🔴 Low
  error:
    breakeven_incomplete: Unit price / variable cost / fixed cost not fully given; cannot compute breakeven
    rev_based_note: "No unit price given; used \"revenue-based\" breakeven (monthly revenue required) instead"
    runway_vc_missing: Variable cost ratio not given; runway cannot be computed
    runway_invest_missing: Total investment not given; runway cannot be computed
    runway_fixed_missing: Fixed cost not given; runway cannot be computed
    sens_incomplete: Insufficient inputs; cannot compute sensitivity
    quick_scan_fail: "quick_scan failed: {e}"
    trend_fail: "trend_projection failed: {e}"
    compare_fail: "compare_scenarios failed: {e}"
    cashflow_fail: "cashflow_projection failed: {e}"
