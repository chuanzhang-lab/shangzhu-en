  runway_critical:
    type: "Cash flow about to break"
    detail: "Cash only covers {months} months."
    impact: "Running out of cash is the number one cause of death for startups."
    action: "Cut non-essential spending now; speed up collections; start fundraising or seek a bridge loan."
  runway_tight:
    type: "Cash flow tight"
    detail: "Cash only covers {months} months — less than a year."
    impact: "The window for experimenting and adjusting is very narrow."
    action: "Plan a 20% cost cut within 3 months; approach investors early."
  cash_gap:
    type: "Cash-flow scissors gap"
    detail: "Receivables {ar} days, payables {ap} days — a {gap}-day funding gap."
    impact: "You are financing your customers with your own money."
    action: "Shorten terms: bring receivables down to within {target} days; require prepayment from large customers."
  slow_inventory:
    type: "Inventory turns too slowly"
    detail: "Inventory turnover is {days} days — more than 3 months."
    impact: "A lot of cash is trapped in stock, which is also exposed to depreciation or expiry."
    action: "Clear slow-moving stock; optimise purchasing; consider JIT or a pre-sale model."
  zero_revenue_burn:
    type: "Burning cash with zero revenue"
    detail: "There is no revenue yet, but fixed monthly expenses continue."
    impact: "If revenue does not arrive before the runway runs out, the project will be forced to stop."
    action: "Set explicit revenue milestones and deadlines; consider validating with an MVP first."
  tam_too_broad:
    type: "Market defined too broadly"
    detail: "The TAM description uses very broad wording, but the team is only {team} people."
    impact: "An overly broad market definition means there is no clear entry point, and resources get spread thin."
    action: "Narrow the market to a segment you can actually validate. Ask yourself: who exactly are the first 100 paying customers?"
  claims_no_competitor:
    type: "Claims to have no competitors"
    detail: "States or implies there are no competitors."
    impact: "Genuinely empty markets almost do not exist. \"No competition\" usually means: the market does not exist, you do not know the alternatives, or you have not identified the substitutes."
    action: "Answer seriously: how do users solve this problem today? That is your real competitor."
  customer_concentration:
    type: "Dependent on a single customer"
    detail: "The largest customer is {pct}% of revenue, above the 40% red line."
    impact: "Losing that one customer could break the company's cash flow."
    action: "Bring the largest customer below 30% of revenue. Actively add new customers to spread the risk."
  solo_founder:
    type: "Solo founder"
    detail: "There is only one founder."
    impact: "All decision pressure sits on one person, with no checks and no complementary skills. Investors are usually more cautious about solo-founder teams."
    action: "Find 1-2 complementary co-founders as soon as possible, covering gaps in tech / product / market."
  no_tech_cofounder:
    type: "Tech project without a technical co-founder"
    detail: "This is a technology-driven project, but the team has no technical co-founder."
    impact: "Technical decisions, product iteration and hiring all suffer badly. Outsourced tech teams rarely ship a good product."
    action: "You must find a technical co-founder (CTO) rather than rely on outsourcing. Core technology and product must stay in-house."
  no_domain_expert:
    type: "No domain expert"
    detail: "Nobody on the team has deep understanding of the target industry."
    impact: "You risk building something technically good that nobody needs, or hitting industry-specific traps."
    action: "Bring in an advisor or partner with industry experience, involved deeply at least in the early stage."
  # 证照名称是**美国司法辖区数据**（联邦/州/市三级），见 src/tools/compliance_map.py。
  # 原则是**标注口径**而非翻译：如实给出原名，并明确告知需按其所在州/市核实。
  license_required:
    warning: "Detected {n} possible US compliance requirements (federal / state / local names shown as-is); missing any one can lead to fines or forced closure."
    action: "Consult a lawyer or your state/city business-registration office before you start operating: most of these licences are issued at state or county level, so confirm the exact list for your jurisdiction."
  license_none:
    message: "No industry-specific compliance requirement recognised from the description. If you operate in food, healthcare, finance, education or similar, verify it yourself."
    action: "Almost every US business needs at least: an EIN (federal tax ID), a state/city business licence, a seller's permit if you sell taxable goods, and payroll registration if you hire."

