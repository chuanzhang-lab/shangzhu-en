fc:
  common:
    empty_cashflows: Cash flow array cannot be empty
    bad_cashflows_json: cashflows_json is malformed; a valid JSON array is required
    calc_fail: "Calculation failed: {e}"
  npv:
    worth: Project is worth investing in
    no_value: Project creates no value
    breakeven: Project just breaks even
    note: NPV > 0 means value creation; NPV < 0 means likely loss; NPV = 0 means break-even
  be:
    must_gt: Price must exceed variable cost
    must_gt_full: Price must exceed variable cost, otherwise it can never be profitable
    suggestion: "Current price {price} ≤ variable cost {vc}; every sale loses money. Raise the price or lower the variable cost."
    formula: "Breakeven = fixed cost / (price − variable cost) = {fc} / ({price} − {vc})"
    interpretation: "Need to sell ~{units} units, or achieve revenue of {revenue} CNY, to break even."
  runway:
    cash_missing: Cash missing; runway cannot be computed
    positive: The company is already cash-flow positive; no additional financing needed.
    advice_plenty: Runway is ample; proceed as planned.
    advice_ok: Runway is acceptable; consider starting the next round in ~6 months.
    advice_tight: Runway is tight; start financing or cut spending immediately.
    advice_critical: "🚨 Runway under 6 months! Act now: cut costs, accelerate revenue, or raise emergency financing."
    note: "At a net burn of {burn} CNY/month, cash runs out in ~{months} months."
  ue:
    cac_gt0: CAC must be greater than 0
    acquisition_gt0: Customer acquisition cost must be greater than 0
    healthy: Healthy
    acceptable: Acceptable
    danger: Danger
    detail_healthy: LTV/CAC ≥ 3; excellent acquisition efficiency, can scale spend.
    detail_acceptable: LTV/CAC between 1 and 3; acceptable but needs ongoing optimization.
    detail_danger: LTV/CAC < 1; losing money per acquired customer. Lower CAC or raise LTV.
    warn_cac_ratio: "CAC ({cac}) is too large a share of LTV ({ltv}); payback may be too long."
    warn_gm: "Gross margin is only {gm}%; little room left for acquisition."
    benchmark: "SaaS: LTV/CAC ≥ 3 recommended; general industries: ≥ 1.5"
  sens:
    pessimistic: Pessimistic
    neutral: Neutral
    optimistic: Optimistic
    note: Variable cost moves with revenue proportionally; fixed cost fluctuates independently (contribution-margin basis)
    note_full: Variable cost moves with revenue proportionally; fixed cost fluctuates independently (contribution-margin basis). The wider the profit range, the higher the risk.
    scenario: "Revenue {rev}% / Fixed cost {fix}%"
  cashflow:
    opening_cash: Opening cash (not computable if total investment is not given)
    revenue: Monthly revenue
  irr:
    unconverged: Cannot compute IRR; check whether the cash flows are reasonable
    excellent: Excellent return
    good: Good return
    fair: Fair return
    low: Low return
    note: Higher IRR is better; if IRR > discount rate (typically 8–12%), the project has investment value
  roi:
    invest_gt0: Total investment must be greater than 0
    excellent: Excellent return
    good: Good return
    fair: Decent return
    poor: Average return
    loss: Loss
  proj:
    months_range: Projection months must be between 1 and 60
    note: This projection assumes constant growth; real growth usually slows. Consider optimistic/neutral/pessimistic scenarios.
  cs:
    warn_fixed_ratio: "Fixed cost is too large a share of total cost ({ratio}%); high risk if revenue declines."
