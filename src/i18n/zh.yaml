    no_revenue: 月营收未提供，无法计算月利润与趋势
    no_fixed: 固定成本未提供，无法计算月利润与趋势
  bench:
    margin_low: "净利率 {nm}% 低于行业典型 {lo}%-{hi}%，需审视定价或是否漏算变动成本。"
    margin_high: "净利率 {nm}% 高于行业典型 {lo}%-{hi}%，确认是否低估了变动/隐形成本。"
