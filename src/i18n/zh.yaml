    variable_cost: 变动成本率（算利润/保本需要）
  kind:
    missing: 缺失
    candidate: 候选
    derived: 推算
    incomplete: 不完整
  framework:
    revenue_known: "月营收 = ${rev}（已知）"
    revenue_unknown: 月营收：未知（需 月营收 或 日均客流×客单价）
    cost: "月固定成本 ≈ 租金 ${rent}"
