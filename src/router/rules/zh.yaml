    regexes: ['pdf\s*报告', '出\s*pdf', '导出.*pdf', 'PDF\s*报告', '出\s*PDF', '导出.*PDF']
  - name: 'report_excel'
    keywords: ['生成excel', '导出excel', '下载excel', 'excel模型', '出excel', '给个excel', '表格模型', '生成Excel', '导出Excel', '下载Excel', 'Excel模型', '出Excel', '给个Excel', '表格模型']
    regexes: ['excel\s*模型', '出\s*excel', 'Excel\s*模型', '出\s*Excel', '导出.*Excel']
