# ─── 字段抽取规则（16 个字段）───────────────────────────────────────────────
# position: before=关键词在数字前 / after=数字在关键词前 / any=都搜
# kw_position: 按关键词覆盖 position（倒装写法，如 "5人团队"）
# reject_units / reject_context: 量纲护栏，挡住「毛利6元」「押金3个月」这类误抓
fields:
  - field: 'monthly_rent'
    keywords: ['月租', '月租金', '租金', '房租', '铺租']
    position: 'before'
    units: ['元', '块', '万', '千']
    reject_units: ['月']
    reject_context: ['押金']
    kw_position: {}
  - field: 'total_investment'
    keywords: ['总投资', '总投入', '启动资金', '本金', '初始投资', '投资', '投入', '前期投入', '投']
    position: 'before'
    units: ['元', '块', '万', '千']
    kw_position: {}
  - field: 'employee_count'
    keywords: ['员工', '雇', '招聘', '团队', '人手', '人工']
    position: 'any'
    units: ['人', '个', '位', '名']
    max_value: 200
    kw_position:
      团队: 'after'
      人手: 'after'
      人工: 'after'
  - field: 'avg_salary'
    keywords: ['人均月薪', '人均工资', '平均工资', '月薪', '工资', '薪资', '每人', '人均']
    position: 'before'
    units: ['元', '块', '万', '千']
    kw_position: {}
  - field: 'daily_traffic'
    keywords:
      - '日均客流'
      - '日均订单'
      - '日均销量'
      - '日均杯'
      - '日均单'
      - '日均卖'
      - '日均售'
      - '日售'
      - '日卖'
      - '日销'
      - '每天客流'
      - '每天订单'
      - '每天销量'
      - '每天卖'
      - '每天出'
      - '每天做'
      - '每天接'
      - '一天卖'
      - '一天出'
      - '一天做'
      - '一天接'
      - '一天大概'
      - '一天能'
      - '客流'
      - '订单量'
      - '销量'
      - '杯/天'
      - '单/天'
      - '人/天'
      - '件/天'
      - '杯每天'
      - '单每天'
      - '人每天'
      - '件每天'
      - '每天'
    position: 'before'
    units: ['杯', '单', '人', '件', '碗', '份', '条', '桌']
    reject_units: ['元', '块', '万', '千']
    reject_context: ['营业额', '营收', '收入', '流水', '销售额', '业绩']
    kw_position:
      杯/天: 'after'
      单/天: 'after'
      人/天: 'after'
      件/天: 'after'
      杯每天: 'after'
      单每天: 'after'
      人每天: 'after'
      件每天: 'after'
  - field: 'price_per_unit'
    keywords:
      - '客单价'
      - '单价'
      - '均价'
      - '售价'
      - '一杯'
      - '一碗'
      - '一份'
      - '一单'
      - '元一杯'
      - '块一杯'
      - '元一碗'
      - '块一碗'
    position: 'after'
    units: ['元', '块']
    reject_context: ['成本']
    kw_position:
      单价: 'before'
      客单价: 'before'
      均价: 'before'
      售价: 'before'
      一杯: 'before'
      一碗: 'before'
      一份: 'before'
      一单: 'before'
  - field: 'monthly_revenue'
    keywords: ['月营收', '月收入', '月流水', '月营业额', '月销售']
    position: 'before'
    units: ['元', '块', '万', '千']
    kw_position: {}
  - field: 'monthly_profit'
    keywords: ['月利润', '月净利', '净利润', '月净利润', '月盈利']
    position: 'before'
    units: ['元', '块', '万', '千']
    kw_position: {}
  - field: 'gross_margin'
    keywords: ['毛利润', '毛利率', '毛利', '毛利润率']
    position: 'after'
    units: ['%', '百分之']
    kw_position:
      毛利润: 'before'
      毛利: 'before'
    reject_units: ['元', '块', '万', '千']
  - field: 'monthly_expense'
    keywords: ['固定成本', '月固定成本', '月支出', '月费用', '月开销', '月运营成本', '运营成本', '月成本']
    position: 'before'
    units: ['元', '块', '万', '千']
    strict_units: true
    kw_position: {}
  - field: 'variable_cost_rate'
    keywords: ['变动成本率', '变动成本', '可变成本率', '可变成本']
    position: 'after'
    units: ['%', '百分之']
    kw_position:
      变动成本: 'before'
      可变成本: 'before'
    reject_units: ['元', '块', '万', '千']
  - field: 'unit_variable_cost'
    keywords: ['每份成本', '单份成本', '单位成本', '每件成本', '每杯成本', '成本单价', '单件成本', '每碗成本', '每份原料成本']
    position: 'before'
    units: ['元', '块', '万', '千']
    kw_position: {}
  - field: 'utilities'
    keywords: ['水电', '水电费', '水电网', '物业费', '物业']
    position: 'before'
    units: ['元', '块', '万', '千']
    kw_position: {}
  - field: 'packaging'
    keywords: ['包装', '包装费', '包材', '包材费']
    position: 'before'
    units: ['元', '块', '万', '千']
    kw_position: {}
  - field: 'commission'
    keywords: ['提成', '佣金', '抽成']
    position: 'before'
    units: ['元', '块', '万', '千']
    reject_units: ['%', '百分之']
    kw_position: {}
  - field: 'other_fixed'
    keywords: ['其他固定', '其他成本', '其他费用', '其他开销', '杂费', '其它固定', '其它', '其他']
    position: 'before'
    units: ['元', '块', '万', '千']
    kw_position: {}

# ─── 无标点连写的切分边界 ──────────────────────────────────────────────────
# 在字段关键词前插逗号，避免「投资30万租金8000」整段共享第一个「万」。
# 保持为整条正则字符串（不拆成词表）：含 lookahead，拆开即变语义。
boundary:
  pattern: '(总投资|总投入|启动资金|前期投入|变动成本率|可变成本率|食材成本|原料成本|材料成本|月租金|年租金|客单价|人均月薪|一天大概|每天大概|一天能|每天能|月租|年租|投资|投入|租金|房租|工资|薪资|月薪|人工|食材|原料|(?:一杯|一碗|一份|一单)(?=\s*\d)|[两一二三四五六七八九十]+个?人)'

# ─── 意图规则（13 类 + chitchat 兜底）──────────────────────────────────────
intents:
