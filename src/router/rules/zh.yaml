# 中文抽取规则包（输入层规则的数据化出处）
#
# 为什么是 yaml 而不是 .py：英文版需要**第二套规则**。若规则继续硬编码在
# param_extractor.py / intent.py 里，加英文就会长出两份逻辑，必然漂移。
# 数据化后：引擎（position 搜索 / 单位换算 / % 归一化）**只有一份**，
# 语言差异只体现在本文件。
#
# 约定：
# - 全部字符串用**单引号**：YAML 单引号内反斜杠不转义，正则里的 \d \s \b
#   能原样保住（用双引号会被当成转义序列吃掉）。
# - industry 的**书写顺序即优先级**（命中即返回）：更具体的行业必须排在更泛的
#   之前——「宠物医院」同时含「宠物」和「医院」，宠物必须排在医疗前面。
#   由 test_cov_f4_every_template_industry_is_reachable 守住 12 行业可达。
# - 本文件是**输入匹配数据**，不是展示文案，不进 src/i18n/。

version: 1

# ─── 数量级倍率（数字解析用，原硬编码在 _parse_number 的元组里）────────────
# 顺序即优先级：缩写「1万5」由第一个命中的单位处理。
number_units:
  万: 10000
  w: 10000
  W: 10000
  千: 1000
  k: 1000
  K: 1000

