# ─── 字段抽取规则（16 个，与 zh.yaml 同键同构）─────────────────────────────
fields:
  - field: 'monthly_rent'
    keywords: ['monthly rent', 'rent per month', 'rent', 'rental', 'lease', 'monthly lease']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'k', 'thousand', 'm', 'million']
    reject_units: ['year', 'annual']
    reject_context: ['deposit', 'security deposit']
    kw_position: {}
  - field: 'total_investment'
    keywords: ['total investment', 'startup capital', 'initial investment', 'investment', 'invest', 'capital', 'budget', 'putting in']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'k', 'thousand', 'm', 'million']
    kw_position: {}
  - field: 'employee_count'
    keywords: ['employees', 'employee', 'staff', 'headcount', 'team', 'workers', 'people', 'hires', 'employ']
    position: 'any'
    units: ['employees', 'staff', 'people', 'workers', 'persons', 'members', 'hires']
    max_value: 200
    kw_position:
      team: 'after'
      staff: 'after'
      workers: 'after'
  - field: 'avg_salary'
    # E-02：英文真实说法大面积漏抽（5 条实测漏 4 条），人工是结果最敏感的假设，
    # 漏抽 → 固定成本被低估 → 利润/回本偏乐观。故补齐常见动词与人头口径写法。
    # ⚠️ 这里**不加 earning/earns**：它们是 `earnings` 的子串，而通用字段的
    # reject_context 只看关键词两侧，看不到被关键词自己劈开的那个词 ——
    # 实测「monthly earnings 30000」会被读成月薪 30000（营收变薪资）。
    # 这两个词改由 `labor_pair_patterns` 认领（那里要求「N employees … 数字」
    # 相邻，营收句根本进不来）。
    keywords: ['average salary', 'avg salary', 'salary per person', 'monthly salary', 'salary', 'wage', 'wages', 'pay per employee', 'pay each worker', 'payroll per head', 'paid', 'pays',
               'making', 'gets', 'per head', 'pay per head', 'per employee']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'k', 'thousand']
    kw_position: {}
    # 「paid 8000 rent」是房租不是薪资：paid 是薪资动词，但后面紧跟租金语境时拒收。
    # 「monthly earnings 30000」是营收不是薪资：加营收语境词，配合上面的
    # `earning` 是 `earnings` 子串这一事实，防止营收被读成月薪。
    reject_context: ['rent', 'lease', 'rental', 'mortgage', 'deposit', 'for rent',
                     'earnings', 'revenue', 'sales', 'turnover']
  - field: 'daily_traffic'
    keywords:
      - 'daily traffic'
      - 'daily customers'
      - 'daily orders'
      - 'daily sales'
      - 'customers per day'
      - 'customers a day'
      - 'orders per day'
      - 'orders a day'
      - 'guests per day'
      - 'units per day'
      - 'customers/day'
      - 'orders/day'
      - 'sales/day'
      - 'footfall'
      - 'traffic'
      - 'per day'
      - 'a day'
      - 'daily'
      - 'each day'
      - 'every day'
    position: 'before'
    units: ['customers', 'guests', 'orders', 'cups', 'units', 'people', 'visitors', 'sales', 'bowls', 'items', 'covers']
    reject_units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'million']
    reject_context: ['revenue', 'income', 'turnover', 'gross', 'profit']
    kw_position:
      customers per day: 'after'
      customers a day: 'after'
      orders per day: 'after'
      orders a day: 'after'
      guests per day: 'after'
      units per day: 'after'
      per day: 'after'
      a day: 'after'
      customers/day: 'after'
      orders/day: 'after'
      sales/day: 'after'
  - field: 'price_per_unit'
    keywords:
      - 'average ticket'
      - 'avg ticket'
      - 'ticket price'
      - 'ticket average'
      - 'unit price'
      - 'price per unit'
      - 'selling price'
      - 'price'
      - 'per unit'
      - 'per cup'
      - 'per bowl'
      - 'per item'
      - 'per order'
      - 'per day at'
      - 'a day at'
      - 'each'
      - 'a cup'
      - 'a bowl'
    position: 'after'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars']
    reject_units: ['%', 'percent', 'pct']
    # "each" is ambiguous in English: "15 each" (per cup) vs "6000 each" (per person).
    # - kw_position before: take the number BEFORE "each" (otherwise the search runs
    #   off the end of the sentence and grabs a neighbouring number).
    # - reject_context: if that neighbourhood is about headcount/payroll, it is a
    #   salary, not a unit price. Grabbing it invents a price_per_unit out of thin air.
    reject_context: ['cost', 'employee', 'employees', 'staff', 'salary', 'wage',
                     'payroll', 'person', 'people', 'worker', 'workers', 'month',
                     'monthly', '/mo', 'paid', 'pays', 'pay']
    kw_position:
      each: 'before'
      'a cup': 'before'
      'a bowl': 'before'
      price: 'before'
      ticket price: 'before'
      ticket average: 'before'
      unit price: 'before'
      average ticket: 'before'
      avg ticket: 'before'
      selling price: 'before'
      per day at: 'before'
      a day at: 'before'
  - field: 'monthly_revenue'
    keywords: ['monthly revenue', 'monthly sales', 'monthly income', 'monthly turnover', 'revenue', 'turnover', 'sales per month']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'k', 'thousand', 'm', 'million']
    kw_position: {}
  - field: 'monthly_profit'
    keywords: ['monthly profit', 'monthly net profit', 'net profit', 'net income', 'profit']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'k', 'thousand', 'm', 'million']
    kw_position: {}
  - field: 'gross_margin'
    keywords: ['gross margin', 'gross profit margin', 'gross profit', 'margin']
    position: 'before'
    units: ['%', 'percent', 'pct']
    reject_units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars']
    kw_position: {}
  - field: 'monthly_expense'
    keywords: ['fixed costs', 'fixed cost', 'monthly expenses', 'monthly costs', 'operating costs', 'operating cost', 'overhead', 'monthly overhead', 'expenses', 'costs']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'k', 'thousand', 'm', 'million']
    strict_units: true
    kw_position: {}
    # E-03：百分比不是金额。「variable costs 55%」里的 costs 命中本字段关键词，
    # 55 是比例却被收成月支出 → 参数表凭空多一个 monthly_expense=55.0，
    # 还可能触发「客流×单价 vs 营收」之外的假冲突。沿用既有 reject_units 机制。
    reject_units: ['%', 'percent']
  - field: 'variable_cost_rate'
    keywords: ['variable cost rate', 'variable cost ratio', 'variable costs', 'variable cost']
    position: 'before'
    units: ['%', 'percent', 'pct']
    reject_units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars']
    kw_position: {}
  - field: 'unit_variable_cost'
    keywords: ['cost per unit', 'unit cost', 'cost per cup', 'cost per bowl', 'cost per item', 'cost per order']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars']
    kw_position: {}
  - field: 'utilities'
    keywords: ['utilities', 'utility', 'water and electricity', 'electricity', 'water', 'internet', 'property fee', 'property management fee']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'k', 'thousand']
    kw_position: {}
  - field: 'packaging'
    keywords: ['packaging', 'packaging cost', 'packing', 'packaging materials']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'k', 'thousand']
    kw_position: {}
  - field: 'commission'
    keywords: ['commission', 'commissions', 'sales commission', 'referral fee', 'platform fee']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'k', 'thousand']
    reject_units: ['%', 'percent', 'pct']
    kw_position: {}
  - field: 'other_fixed'
    keywords: ['other fixed costs', 'other costs', 'other expenses', 'miscellaneous', 'misc', 'other']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'k', 'thousand']
    kw_position: {}

# ─── 无标点连写的切分边界（英文版）─────────────────────────────────────────
boundary:
  pattern: '(total investment|startup capital|initial investment|monthly rent|annual rent|average ticket|ticket price|unit price|variable cost|salary|wage|rent|lease|investment|capital|traffic|customers|employees|staff|price|revenue|profit|margin)'

# ─── 意图规则（13 类，意图名是数据键，不翻译）──────────────────────────────
intents:
  - name: 'report_pdf'
    keywords: ['generate pdf', 'export pdf', 'download pdf', 'pdf report', 'make a pdf', 'give me a pdf', 'create pdf', 'pdf']
    regexes: ['pdf\s*report', 'export.*pdf', 'export.*PDF', 'generate.*pdf']
  - name: 'report_excel'
    keywords: ['generate excel', 'export excel', 'download excel', 'excel model', 'make an excel', 'give me an excel', 'spreadsheet model', 'create excel', 'excel']
    regexes: ['excel\s*model', 'export.*excel', 'export.*Excel', 'spreadsheet']
  - name: 'suggest'
    keywords:
      - 'how to adjust'
      - 'how to improve'
      - 'how to optimize'
      - 'how to turn profitable'
      - 'turn a profit'
      - 'stop losing money'
      - 'suggestion'
      - 'recommend'
      - 'advice'
      - 'what should i change'
      - 'what to change'
      - 'how much to change'
      - 'optimization'
      - 'improve'
      - 'tune'
      - 'turnaround'
    regexes: []
  - name: 'compare'
    keywords:
      - 'compare'
      - 'comparison'
      - ' vs '
      - 'vs.'
      - 'versus'
      - 'option a'
      - 'option b'
      - 'which is better'
      - 'which one'
      - 'which should i'
      - 'better to'
      - 'a or b'
      - 'if'
      - 'what if'
      - 'suppose'
    regexes: ['\bvs\.?\b', 'option\s*[abAB]', '\bif\b', 'what\s+if', 'which\s+(?:one|is)\s+better']
  - name: 'breakeven'
    keywords: ['break even', 'breakeven', 'break-even', 'not losing money', 'profit and loss balance', 'break even point', 'cover costs']
    regexes: ['break\s*-?\s*even', 'breakeven']
  - name: 'trend'
    keywords:
      - 'trend'
      - 'forecast'
      - 'predict'
      - 'future'
      - 'next month'
      - 'next 12 months'
      - '12 months'
      - 'payback time'
      - 'payback'
      - 'when will it be profitable'
      - 'outlook'
    regexes: ['(?:payback|trend|forecast|future).{0,12}\d+\s*months?', '\d+\s*months?.*(?:payback|trend|forecast)', 'next\s*\d+\s*months?', 'trend', 'forecast']
  - name: 'decide'
    keywords:
      - 'should i open'
      - 'should i start'
      - 'worth opening'
      - 'should i continue'
      - 'should i keep'
      - 'should i close'
      - 'should i quit'
      - 'how long can i survive'
      - 'how long can it last'
      - 'can i survive'
      - 'worth it'
      - 'should i do'
      - 'should i invest'
    regexes: ['should\s+i', 'worth\s+it', 'how\s+long\s+can']
  - name: 'cashflow'
    keywords:
      - 'cash flow'
      - 'cashflow'
      - 'when will the money run out'
      - 'run out of money'
      - 'do i have enough money'
      - 'how much do i spend'
      - 'monthly spending'
      - 'cash details'
      - 'cash situation'
    regexes: ['cash\s*-?\s*flow', '(?:cash|money|funds).*(?:enough|run out|short)']
  - name: 'attribution'
    keywords:
      - 'why am i losing money'
      - 'why is it losing'
      - 'where does the money go'
      - 'where is the money spent'
      - 'cost structure'
      - 'cost breakdown'
      - 'cost analysis'
      - 'cost attribution'
      - 'main cost'
      - 'biggest cost'
    regexes: ['why.*(?:los|los)', 'where.*money.*(?:go|spent)', 'cost.*(?:structure|breakdown|analysis|attribution)']
  - name: 'sensitivity'
    keywords:
      - 'sensitivity'
      - 'sensitivity analysis'
      - 'elasticity'
      - 'how much can it drop'
      - 'how low can traffic go'
      - 'how high can rent go'
      - 'break even point'
      - 'breakeven point'
    regexes: ['(?:drop|fall|decline|decrease).*how much', '(?:rise|increase|grow).*how much', 'sensitivity', 'elasticity']
  - name: 'benchmark'
    keywords:
      - 'industry benchmark'
      - 'industry average'
      - 'industry data'
      - 'industry standard'
      - 'benchmark'
      - 'reference value'
      - 'reasonable value'
      - 'industry margin'
      - 'competitor data'
    regexes: ['industry\s*(benchmark|average|data|standard)', 'benchmark']
  - name: 'market'
    keywords:
      - 'market research'
      - 'market analysis'
      - 'market size'
      - 'market outlook'
      - 'user research'
      - 'target users'
      - 'user persona'
      - 'competitor analysis'
      - 'competitors'
    regexes: ['market\s*(research|analysis|size|outlook)', 'competitor\s*(analysis|research)']
  - name: 'quick_scan'
    keywords:
      - 'open a'
      - 'opening a'
      - 'start a'
      - 'starting a'
      - 'i want to open'
      - 'total investment'
      - 'monthly rent'
      - 'employees'
      - 'traffic'
      - 'average ticket'
      - 'adjust parameters'
      - 'change parameters'
      - 'update parameters'
      - 'recalculate'
      - 'recalculate again'
      - 'recompute'
      - 'add'
      - 'supplement'
      - 'current'
      - 'my project'
    regexes: ['(?:open|start)\s+a\s+[\w-]+\s*(?:shop|store|business|restaurant)?']

# ─── 意图优先级（与 zh.yaml 同值：这是路由权重，不是文案）──────────────────
intent_priority:
  report_pdf: 100
  report_excel: 100
  decide: 85
  suggest: 80
  cashflow: 78
  compare: 70
  breakeven: 75
  attribution: 72
  sensitivity: 68
  trend: 60
  benchmark: 50
  market: 50
  quick_scan: 10
  chitchat: 0

# ── Compare / hypothesis markers: split the "option B" clause out of user text ──
# Input-layer matching data (NOT display copy): with a Chinese-only list an
# English deployment never splits the clause and "compare" silently degrades.
compare_markers:
  - "if "
  - suppose
  - assume
  - assuming
  - "what if"
  - change
  - changed
  - switch to
  - raise
  - raise to
  - lower
  - lower to
  - increase
  - decrease

# ── Industry metric keywords (market intent precision) ────────────────────
market_metrics:
  - gross margin
  - gross profit margin
  - customer acquisition cost
  - cac
  - growth rate
  - market size
  - tam
  - repeat purchase rate
  - repurchase rate
  - average order value
  - unit price
  - conversion rate
  - penetration rate

# ── Focus-field keywords (session_state.infer_focus_fields) ───────────────
# Input-layer matching data: with a Chinese-only list, focus inference never hits.
focus_fields:
  daily_traffic: [traffic, customers, cups, sold, per day, daily, footfall, visitors]
  monthly_rent: [rent, lease, monthly rent, shop rent]
  price_per_unit: [unit price, price per, average price, ticket, aov]
  employee_count: [headcount, staff, employees, team size, people]
  avg_salary: [salary, wage, pay, payroll, per month]
  variable_cost_ratio: [variable cost, cost ratio, cogs, ingredient cost]
  total_investment: [investment, invest, startup capital, initial cost, budget]
  monthly_revenue: [revenue, monthly revenue, sales, turnover, income]
  monthly_profit: [profit, margin, loss, loss-making, profitable]
  utilities: [utilities, electricity, water, power]
  packaging: [packaging, packing, package]
  commission: [commission, platform fee, take rate]

# ── Continuation / reset command words ────────────────────────────────────
# These are **semantic switches**: if English "start over" is not recognised the
# session never resets; if "change rent to" is not recognised the engine skips
# merge and keeps reporting missing parameters.
continuation_hints:
  - recalculate
  - recompute
  - re-run
  - rerun
  - reanalyze
  - re-analyse
  - re-analyze
  - analyse again
  - analyze again
  - change
  - changed
  - set
  - adjust
  - update
  - add
  - also
  - what if
  - if
  - suppose
  - now
  - currently
  - current
  - my project
  - " and "
reset_hints:
  - start over
  - start again
  - new project
  - fresh start
  - clear
  - reset
  - restart
  - another project
  - different project
  - forget
  - forget what
  - change direction
  - switch project
  - wipe

# ── Process-oriented extractor regexes (param_extractor's special-case semantics) ──
# Not copy: these are **semantic recognition rules**. Hardcoding Chinese means an
# English deploy either misses the value or grabs the wrong one.
# Each entry carries explicit group numbers so the two languages need not share order.

# Variable cost ratio (normalised 0~1): "45% of revenue" / "variable cost 60%"
vc_ratio_patterns:
  - regex: '(?:ingredient|material|raw material|cogs|variable)(?:\s+cost)?\s*(?:is|are|at|of|about|around)?\s*(-?\d+(?:\.\d+)?)\s*(?:%|percent\b)'
  - regex: '(?:variable cost ratio|variable cost rate|cost ratio)\s*(?:is|are|at|of|=)?\s*(-?\d{1,3}(?:\.\d+)?)\s*(?:%|percent\b)'
  - regex: '(-?\d+(?:\.\d+)?)\s*(?:%|percent\b)\s*(?:of\s+)?(?:revenue|sales|turnover|income)'
  # Bare "cost 55%" / "costs at 55%" — the plain-English shorthand. Runs last so the
  # specific phrases above win. lookbehind keeps it away from fixed/total/unit cost
  # (the last belongs to unit_variable_cost, not a rate).
  - regex: '(?<!fixed\s)(?<!total\s)(?<!unit\s)(?<!per\s)(?:costs?|cost\s+ratio|cost\s+rate)\s*(?:is|are|at|of|=|:)?\s*(-?\d{1,3}(?:\.\d+)?)\s*(?:%|percent\b)'

# Annual rent -> monthly rent = annual / 12 (treating annual as monthly is a 12x error)
# Order matters: "annual rent" style (keyword first) must run before the generic
# "rent ... per year" form, and both must run before the generic rent field grabs
# the number as a monthly value.
annual_rent_patterns:
  - regex: '(?:annual rent|yearly rent|rent per year|rent per annum|annual lease|yearly lease)\s*((?:-?\d+(?:\.\d+)?)(?:\s*(?:k|thousand|million|m|bn|billion))?)'
  # "rent 120000 per year": number BEFORE the marker. Capture must span both sides.
  - regex: '(?:rent|lease)\s*((?:-?\d+(?:\.\d+)?)(?:\s*(?:k|thousand|million|m|bn|billion))?)\s*(?:per year|a year|annually|yearly|per annum)'
  - regex: '(?:rent|lease)\s*[^0-9]{0,12}?(?:per year|a year|annually|yearly|per annum)\s*((?:-?\d+(?:\.\d+)?)(?:\s*(?:k|thousand|million|m|bn|billion))?)'
  - regex: '(?:a year|per year|annually|yearly|per annum)(?:\s+of)?(?:\s+rent)?\s*((?:-?\d+(?:\.\d+)?)(?:\s*(?:k|thousand|million|m|bn|billion))?)'

# Labor pair: "2 employees at 6000 each" / "salary 6000 x 2" — capture both at once
# so the headcount is never mistaken for the salary (and vice versa).
labor_pair_patterns:
  # E-02：中间的连接词补 `earning/earns/making/get` —— 「4 employees earning $3,500 each」
  # 这类说法在英语里极常见，旧正则只认 at/with/each 等，连接词不匹配就整条漏抽。
  # `earning` 放在**这里**而不是 avg_salary.keywords：这里要求「N employees … 数字」
  # 相邻，「monthly earnings 30000」（营收）根本进不来，天然不会把营收读成薪资。
  - regex: '(\d+)\s*(?:employees|employee|staff|people|persons|person|workers|worker|heads|head|hires|hire)\s*(?:at|with|×|x|\*|@|earning|earns|making|makes|get|gets)?\s*(?:salary|wage|pay|each|a month|per month|monthly)?\s*\$?(\d+(?:\.\d+)?)\s*(?:k|thousand)?'
    count_group: 1
    salary_group: 2
  - regex: '(?:salary|wage|pay)\s*\$?(\d+(?:\.\d+)?)\s*(?:k|thousand)?\s*(?:×|x|\*|for|times|each)?\s*(\d+)\s*(?:employees|employee|staff|people|persons|person|workers|worker|heads|head|hires|hire)?'
    count_group: 2
    salary_group: 1
  - regex: '(\d+)\s*(?:employees|employee|staff|people|persons|person|workers|worker)\s*[*×xX]\s*\$?(\d+(?:\.\d+)?)\s*(?:k|thousand)?'
    count_group: 1
    salary_group: 2
  # Comma-separated: "2 employees, 2800 each" — 逗号把人数与薪资切成两个分句，
  # 上面第一条要求两者相邻，匹配不到；而 "2800 each" 落进售价规则 → 薪资变成客单价。
  # 误抓由 _plausible_labor 兜底（薪资须 500~500000）："2 employees, 80 customers"
  # 这类会取到 80 → 判废 → 退回原行为，不会污染。
  - regex: '(\d+)\s*(?:employees|employee|staff|people|persons|person|workers|worker)\s*[,，]\s*(?:salary|wage|pay|each|a month|per month|monthly)?\s*\$?(\d+(?:\.\d+)?)\s*(?:k|thousand)?'
    count_group: 1
    salary_group: 2


# ── L2 intent reinforcement markers (intent.py strong-compare / decision / cashflow) ──
# Semantic switches: failing to recognise "should I continue" means the user
# gets a bare dashboard instead of "options + risks + what to validate".
strong_compare_markers: [compare, comparison, " vs ", versus, "option a",
  "option b", "which is better", "which one", "which should i", "better to",
  "a or b", "plan a", "plan b"]
weak_compare_markers: [if, suppose, assuming, what if]
decision_markers: [should i open, should i start, should i continue,
  should i keep, should i close, should i quit, should i shut down,
  should i do, should i invest, is it worth, worth it, worth opening,
  worth continuing, worth doing, how long can i survive, how long can it last,
  how long will it last, can i survive, keep going or not, what to validate first,
  validate what first, what should i validate, when to pull the plug,
  pull the plug, shut it down or not]
cashflow_markers: [cash flow, cashflow, cash situation, cash details,
  monthly cash, when will the money run out, run out of money,
  will i run out, do i have enough money, enough cash, how much do i spend,
  monthly spending, spending details, money left at month end,
  how much am i short]

# decision sub-type markers (intent.decide_type_of, order = priority)
decision_subtypes:
  turnaround: [turn around, turn it around, revive, how to fix, how to adjust,
    how to optimize, what to change, fix it, save the business]
  validate_first: [validate first, what to validate, validate what, what to test first]
  go_no_go: [should i open, should i start, worth opening, worth starting,
    go or no go, worth doing, should i do it, should i launch]
  continue_stop: [should i continue, should i keep going, should i stop,
    should i close, should i shut down, close or not, still viable,
    keep going or not, should i quit]
  runway: [how long can i last, how long can cash last, how long will cash last,
    runway, how long can i survive, cash runway, how many months can i last]
  choose: [which one, which is better, which should i choose, how to choose,
    which option, compare, or should i]
