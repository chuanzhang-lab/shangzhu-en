# ─── 字段抽取规则（16 个，与 zh.yaml 同键同构）─────────────────────────────
fields:
  - field: 'monthly_rent'
    keywords: ['monthly rent', 'rent per month', 'rent', 'rental', 'lease', 'monthly lease']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'k', 'thousand', 'm', 'million']
    reject_units: ['year', 'annual']
    reject_context: ['deposit', 'security deposit']
    kw_position: {}
  - field: 'total_investment'
    keywords: ['total investment', 'startup capital', 'initial investment', 'investment', 'invest', 'capital', 'budget']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'k', 'thousand', 'm', 'million']
    kw_position: {}
  - field: 'employee_count'
    keywords: ['employees', 'employee', 'staff', 'headcount', 'team', 'workers', 'people', 'hires']
    position: 'any'
    units: ['employees', 'staff', 'people', 'workers', 'persons', 'members', 'hires']
    max_value: 200
    kw_position:
      team: 'after'
      staff: 'after'
      workers: 'after'
  - field: 'avg_salary'
    keywords: ['average salary', 'avg salary', 'salary per person', 'monthly salary', 'salary', 'wage', 'wages', 'pay per employee', 'payroll per head']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'k', 'thousand']
    kw_position: {}
  - field: 'daily_traffic'
    keywords:
      - 'daily traffic'
      - 'daily customers'
      - 'daily orders'
      - 'daily sales'
      - 'customers per day'
      - 'customers a day'
      - 'orders per day'
      - 'orders a day'
      - 'guests per day'
      - 'units per day'
      - 'customers/day'
      - 'orders/day'
      - 'sales/day'
      - 'footfall'
      - 'traffic'
      - 'per day'
      - 'a day'
      - 'daily'
      - 'each day'
      - 'every day'
    position: 'before'
    units: ['customers', 'guests', 'orders', 'cups', 'units', 'people', 'visitors', 'sales', 'bowls', 'items', 'covers']
    reject_units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'million']
    reject_context: ['revenue', 'income', 'turnover', 'gross', 'profit']
    kw_position:
      customers per day: 'after'
      customers a day: 'after'
      orders per day: 'after'
      orders a day: 'after'
      guests per day: 'after'
      units per day: 'after'
      per day: 'after'
      a day: 'after'
      customers/day: 'after'
      orders/day: 'after'
      sales/day: 'after'
  - field: 'price_per_unit'
    keywords:
      - 'average ticket'
      - 'avg ticket'
      - 'ticket price'
      - 'unit price'
      - 'price per unit'
      - 'selling price'
      - 'price'
      - 'per unit'
      - 'per cup'
      - 'per bowl'
      - 'per item'
      - 'per order'
      - 'each'
      - 'a cup'
      - 'a bowl'
    position: 'after'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars']
    # "each" is ambiguous in English: "15 each" (per cup) vs "6000 each" (per person).
    # - kw_position before: take the number BEFORE "each" (otherwise the search runs
    #   off the end of the sentence and grabs a neighbouring number).
    # - reject_context: if that neighbourhood is about headcount/payroll, it is a
    #   salary, not a unit price. Grabbing it invents a price_per_unit out of thin air.
    reject_context: ['cost', 'employee', 'employees', 'staff', 'salary', 'wage',
                     'payroll', 'person', 'people', 'worker', 'workers', 'month',
                     'monthly', '/mo']
    kw_position:
      each: 'before'
      'a cup': 'before'
      'a bowl': 'before'
      price: 'before'
      ticket price: 'before'
      unit price: 'before'
      average ticket: 'before'
      avg ticket: 'before'
      selling price: 'before'
  - field: 'monthly_revenue'
    keywords: ['monthly revenue', 'monthly sales', 'monthly income', 'monthly turnover', 'revenue', 'turnover', 'sales per month']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'k', 'thousand', 'm', 'million']
    kw_position: {}
  - field: 'monthly_profit'
    keywords: ['monthly profit', 'monthly net profit', 'net profit', 'net income', 'profit']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'k', 'thousand', 'm', 'million']
    kw_position: {}
  - field: 'gross_margin'
    keywords: ['gross margin', 'gross profit margin', 'gross profit', 'margin']
    position: 'before'
    units: ['%', 'percent', 'pct']
    reject_units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars']
    kw_position: {}
  - field: 'monthly_expense'
    keywords: ['fixed costs', 'fixed cost', 'monthly expenses', 'monthly costs', 'operating costs', 'operating cost', 'overhead', 'monthly overhead', 'expenses', 'costs']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'k', 'thousand', 'm', 'million']
    strict_units: true
    kw_position: {}
  - field: 'variable_cost_rate'
    keywords: ['variable cost rate', 'variable cost ratio', 'variable costs', 'variable cost']
    position: 'before'
    units: ['%', 'percent', 'pct']
    reject_units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars']
    kw_position: {}
  - field: 'unit_variable_cost'
    keywords: ['cost per unit', 'unit cost', 'cost per cup', 'cost per bowl', 'cost per item', 'cost per order']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars']
    kw_position: {}
  - field: 'utilities'
    keywords: ['utilities', 'utility', 'water and electricity', 'electricity', 'water', 'internet', 'property fee', 'property management fee']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'k', 'thousand']
    kw_position: {}
  - field: 'packaging'
    keywords: ['packaging', 'packaging cost', 'packing', 'packaging materials']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'k', 'thousand']
    kw_position: {}
  - field: 'commission'
    keywords: ['commission', 'commissions', 'sales commission', 'referral fee', 'platform fee']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'k', 'thousand']
    reject_units: ['%', 'percent', 'pct']
    kw_position: {}
  - field: 'other_fixed'
    keywords: ['other fixed costs', 'other costs', 'other expenses', 'miscellaneous', 'misc', 'other']
    position: 'before'
    units: ['$', 'usd', 'cny', 'rmb', 'yuan', 'dollars', 'k', 'thousand']
    kw_position: {}

# ─── 无标点连写的切分边界（英文版）─────────────────────────────────────────
boundary:
  pattern: '(total investment|startup capital|initial investment|monthly rent|annual rent|average ticket|ticket price|unit price|variable cost|salary|wage|rent|lease|investment|capital|traffic|customers|employees|staff|price|revenue|profit|margin)'

# ─── 意图规则（13 类，意图名是数据键，不翻译）──────────────────────────────
intents:
  - name: 'report_pdf'
    keywords: ['generate pdf', 'export pdf', 'download pdf', 'pdf report', 'make a pdf', 'give me a pdf', 'create pdf', 'pdf']
    regexes: ['pdf\s*report', 'export.*pdf', 'export.*PDF', 'generate.*pdf']
  - name: 'report_excel'
    keywords: ['generate excel', 'export excel', 'download excel', 'excel model', 'make an excel', 'give me an excel', 'spreadsheet model', 'create excel', 'excel']
    regexes: ['excel\s*model', 'export.*excel', 'export.*Excel', 'spreadsheet']
  - name: 'suggest'
    keywords:
      - 'how to adjust'
      - 'how to improve'
      - 'how to optimize'
      - 'how to turn profitable'
      - 'turn a profit'
      - 'stop losing money'
      - 'suggestion'
      - 'recommend'
      - 'advice'
      - 'what should i change'
      - 'what to change'
      - 'how much to change'
      - 'optimization'
      - 'improve'
      - 'tune'
      - 'turnaround'
    regexes: []
  - name: 'compare'
    keywords:
      - 'compare'
      - 'comparison'
      - ' vs '
      - 'vs.'
      - 'versus'
      - 'option a'
      - 'option b'
      - 'which is better'
      - 'which one'
      - 'which should i'
      - 'better to'
      - 'a or b'
      - 'if'
      - 'what if'
      - 'suppose'
    regexes: ['\bvs\.?\b', 'option\s*[abAB]', '\bif\b', 'what\s+if', 'which\s+(?:one|is)\s+better']
  - name: 'breakeven'
    keywords: ['break even', 'breakeven', 'break-even', 'not losing money', 'profit and loss balance', 'break even point', 'cover costs']
    regexes: ['break\s*-?\s*even', 'breakeven']
  - name: 'trend'
    keywords:
      - 'trend'
      - 'forecast'
      - 'predict'
      - 'future'
      - 'next month'
      - 'next 12 months'
      - '12 months'
      - 'payback time'
      - 'payback'
      - 'when will it be profitable'
      - 'outlook'
    regexes: ['(?:payback|trend|forecast|future).{0,12}\d+\s*months?', '\d+\s*months?.*(?:payback|trend|forecast)', 'next\s*\d+\s*months?', 'trend', 'forecast']
  - name: 'decide'
    keywords:
      - 'should i open'
      - 'should i start'
      - 'worth opening'
      - 'should i continue'
      - 'should i keep'
      - 'should i close'
      - 'should i quit'
      - 'how long can i survive'
      - 'how long can it last'
      - 'can i survive'
      - 'worth it'
      - 'should i do'
      - 'should i invest'
    regexes: ['should\s+i', 'worth\s+it', 'how\s+long\s+can']
  - name: 'cashflow'
    keywords:
      - 'cash flow'
      - 'cashflow'
      - 'when will the money run out'
      - 'run out of money'
      - 'do i have enough money'
      - 'how much do i spend'
      - 'monthly spending'
      - 'cash details'
      - 'cash situation'
    regexes: ['cash\s*-?\s*flow', '(?:cash|money|funds).*(?:enough|run out|short)']
  - name: 'attribution'
    keywords:
      - 'why am i losing money'
      - 'why is it losing'
      - 'where does the money go'
      - 'where is the money spent'
      - 'cost structure'
      - 'cost breakdown'
      - 'cost analysis'
      - 'cost attribution'
      - 'main cost'
      - 'biggest cost'
    regexes: ['why.*(?:los|los)', 'where.*money.*(?:go|spent)', 'cost.*(?:structure|breakdown|analysis|attribution)']
  - name: 'sensitivity'
    keywords:
      - 'sensitivity'
      - 'sensitivity analysis'
      - 'elasticity'
      - 'how much can it drop'
      - 'how low can traffic go'
      - 'how high can rent go'
      - 'break even point'
      - 'breakeven point'
    regexes: ['(?:drop|fall|decline|decrease).*how much', '(?:rise|increase|grow).*how much', 'sensitivity', 'elasticity']
  - name: 'benchmark'
    keywords:
      - 'industry benchmark'
      - 'industry average'
      - 'industry data'
      - 'industry standard'
      - 'benchmark'
      - 'reference value'
      - 'reasonable value'
      - 'industry margin'
      - 'competitor data'
    regexes: ['industry\s*(benchmark|average|data|standard)', 'benchmark']
  - name: 'market'
    keywords:
      - 'market research'
      - 'market analysis'
      - 'market size'
      - 'market outlook'
      - 'user research'
      - 'target users'
      - 'user persona'
      - 'competitor analysis'
      - 'competitors'
    regexes: ['market\s*(research|analysis|size|outlook)', 'competitor\s*(analysis|research)']
  - name: 'quick_scan'
    keywords:
      - 'open a'
      - 'opening a'
      - 'start a'
      - 'starting a'
      - 'i want to open'
      - 'total investment'
      - 'monthly rent'
      - 'employees'
      - 'traffic'
      - 'average ticket'
      - 'adjust parameters'
      - 'change parameters'
      - 'update parameters'
      - 'recalculate'
      - 'recalculate again'
      - 'recompute'
      - 'add'
      - 'supplement'
      - 'current'
      - 'my project'
    regexes: ['(?:open|start)\s+a\s+[\w-]+\s*(?:shop|store|business|restaurant)?']

# ─── 意图优先级（与 zh.yaml 同值：这是路由权重，不是文案）──────────────────
intent_priority:
  report_pdf: 100
  report_excel: 100
  decide: 85
  suggest: 80
  cashflow: 78
  compare: 70
  breakeven: 75
  attribution: 72
  sensitivity: 68
  trend: 60
  benchmark: 50
  market: 50
  quick_scan: 10
  chitchat: 0

