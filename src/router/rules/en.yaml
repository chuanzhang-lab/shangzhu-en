# 英文抽取规则包（输入层规则）
#
# 与 zh.yaml **同构同键**：字段名、position、units/reject_units 结构完全一致，
# 由 tests/test_rules_guard.py 断言两套规则的字段/意图集合相等（防漂移）。
#
# ⚠️ 关键边界：**行业的值保持中文**（餐饮 / 零售 / …）。
# 它不是展示文案，是 config/industry_templates.yaml 的**数据键**——
# 翻译成 "Food & Beverage" 会让引擎查不到模板、静默拿不到行业默认值。
# 本文件只把**匹配用的关键词**换成英文，值仍是数据键。
# （与 M4 source_tags「状态码 vs 展示文案」、以及“数据值不翻译”同一原则。）

version: 1

# ─── 数量级倍率 ────────────────────────────────────────────────────────────
# 裸 'm' 可以安全收：_parse_number 用**锚定**匹配（数字紧邻单位），
# "80/month" 的 "/" 会打断匹配，不会被当成 80×1e6。
number_units:
  k: 1000
  K: 1000
  thousand: 1000
  m: 1000000
  million: 1000000

