[project]
name = "vibe-coding"
version = "0.1.0"
description = "创业者财务分析工作台 — 本地独立工作台 (A)"
requires-python = ">=3.12"
# ── 本地工作台 (A) 必需依赖 ──
# 仅包含 web_server + 引擎层(router/session_state/workflow_engine/
# financial_calculator/formatter/llm_advisor) 实际需要的包。
# 这些是「一键 uv sync 即可本地运行 (A)」的最小集合。
dependencies = [
    "langchain==1.0.3",
    "langchain-openai==1.0.1",
    "langgraph==1.0.2",                 # A 链路间接依赖（llm_advisor / workflow_engine 经 langchain 拉入）
    "langgraph-sdk==0.2.9",
    "langsmith==0.4.39",
    "fastapi>=0.121,<1",
    "uvicorn>=0.38,<1",
    "pydantic>=2.12,<3",
    "Jinja2>=3.1,<4",
    "python-dotenv>=1.2,<2",
    "openpyxl>=3.1,<4",
    "rich>=14,<15",
    "psycopg[binary]>=3.3,<4",          # PostgresStore 持久化首选（任务数据落盘本机 PG；
                                        # 历史教训：放 extra 会被 uv sync 剪掉→静默降级丢数据，
                                        # 护栏见 tests/test_persistence_guard.py）
    "PyYAML>=6,<7",                     # 解析 config/industry_templates.yaml 与 src/i18n/*.yaml。
                                        # 历史教训同上：此前只靠 langchain 传递依赖，
                                        # decision_engine/workflow_engine 顶层 import 却未声明，
                                        # uv sync 一剪即 ImportError。护栏见 tests/test_i18n_guard.py
]

[tool.uv]
# 使用阿里云镜像作为默认源，替代 pypi.org
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

# pypi 仅供 [tool.uv.sources] 显式引用：阿里云镜像同步 PyPI 新版有延迟（小时级），
# 当某个内部包的预发布版（如 a/b/rc 后缀）刚 push 到官方 PyPI 还未同步到镜像时，
# 临时让该包从 PyPI 取，避免 lock/install 失败。explicit=true 保证不影响其他包的解析。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
explicit = true

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=0.23,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
